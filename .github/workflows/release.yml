name: Release Installer & Portable Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows Installer (.exe + latest.yml) & Portable (.zip)
        shell: bash
        run: |
          npx electron-builder --win nsis --x64 --publish never
          node scripts/write-latest-yml.mjs
          node scripts/build-portable.mjs win

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            release/VeloIde-Setup-*.exe
            release/VeloIde-Setup-*.exe.blockmap
            release/latest.yml
            release/VeloIde-Portable-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & run tests
        run: |
          npm run build
          npm run verify:registry
          npm test

      - name: Build Linux Installer (AppImage + deb) & Portable (.tar.gz)
        run: |
          npx electron-builder --linux AppImage deb --x64 --publish never
          node scripts/build-portable.mjs linux

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            release/VeloIde-*.AppImage
            release/VeloIde-*.deb
            release/VeloIde-Portable-*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build macOS Installer (.dmg) & Portable (.zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          node scripts/build-portable.mjs mac arm64

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            release/VeloIde-*.dmg
            release/VeloIde-Portable-*.zip

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Publish atomic GitHub Release with all Installer & Portable builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          ls -lh all-assets/
          NOTES=$(cat <<'EOF'
          ## VeloIde — Open it. Fix it. Run it. Close it.

          Free, local-first ziptie IDE based on [VeloWrite](https://github.com/halxo/velowrite).
          - **45+ languages, compilers installed on demand** (zero compilers pre-bundled; system compilers used first)
          - **Local Qwen2.5-Coder-1.5B autocomplete** (offline FIM ghost text via `llama.cpp`, downloadable on demand or disabled permanently)
          - **Zero accounts, zero telemetry, 100% free**

          ### Choose your mode

          | Mode | Download | Best for |
          | --- | --- | --- |
          | **Installer (Windows)** | `VeloIde-Setup-1.0.0.exe` | Daily driver with Start Menu shortcuts & automatic GitHub updates |
          | **Portable (Windows)** | `VeloIde-Portable-1.0.0-win-x64.zip` | USB stick or drop-anywhere folder — stores everything in `./data/` and leaves nothing behind |
          | **Installer (Linux)** | `VeloIde-1.0.0-linux-x86_64.AppImage` / `VeloIde-1.0.0-linux-amd64.deb` | Native Linux desktop install |
          | **Portable (Linux)** | `VeloIde-Portable-1.0.0-linux-x64.tar.gz` | Self-contained folder/USB stick on Linux |
          | **Installer (macOS)** | `VeloIde-1.0.0-mac-arm64.dmg` | Drag-to-Applications macOS install |
          | **Portable (macOS)** | `VeloIde-Portable-1.0.0-mac-arm64.zip` | Self-contained macOS folder/USB stick |
          EOF
          )

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" all-assets/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" all-assets/* \
              -R "$GITHUB_REPOSITORY" \
              --title "VeloIde $TAG" \
              --notes "$NOTES"
          fi
