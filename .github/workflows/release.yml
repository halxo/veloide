name: Release Installer & Portable Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag || 'v1.0.0' }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build & Publish Windows Installer (.exe + auto-updater latest.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Build Windows Portable (.zip with portable marker)
        shell: bash
        run: |
          node scripts/build-portable.mjs win

      - name: Upload Windows Portable zip & update Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          ## VeloIde — Open it. Fix it. Run it. Close it.

          Free, local-first ziptie IDE based on [VeloWrite](https://github.com/halxo/velowrite).
          - **45+ languages, compilers installed on demand** (zero compilers pre-bundled; system compilers used first)
          - **Local Qwen2.5-Coder-1.5B autocomplete** (offline FIM ghost text via `llama.cpp`, downloadable on demand or disabled permanently)
          - **Zero accounts, zero telemetry, 100% free**

          ### Choose your mode

          | Mode | Download | Best for |
          | --- | --- | --- |
          | **Installer (Windows)** | `VeloIde-Setup-1.0.0.exe` | Daily driver with Start Menu shortcuts & automatic GitHub updates |
          | **Portable (Windows)** | `VeloIde-Portable-1.0.0-win-x64.zip` | USB stick or drop-anywhere folder — stores everything in `./data/` and leaves nothing behind |
          | **Installer (Linux)** | `VeloIde-1.0.0-linux-x64.AppImage` / `.deb` | Native Linux desktop install |
          | **Portable (Linux)** | `VeloIde-Portable-1.0.0-linux-x64.tar.gz` | Self-contained folder/USB stick on Linux |
          | **Installer (macOS)** | `VeloIde-1.0.0-mac-arm64.dmg` | Drag-to-Applications macOS install |
          | **Portable (macOS)** | `VeloIde-Portable-1.0.0-mac-arm64.zip` | Self-contained macOS folder/USB stick |
          EOF
          )
          gh release upload "$TAG" release/VeloIde-Portable-*-win-x64.zip --clobber
          REL_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" -f name="VeloIde ${TAG}" -f body="$NOTES" >/dev/null

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & run tests
        run: |
          npm run build
          npm run verify:registry
          npm test

      - name: Build Linux Installer (AppImage + deb) & Portable (.tar.gz)
        run: |
          npx electron-builder --linux AppImage deb --x64 --publish never
          node scripts/build-portable.mjs linux

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            release/VeloIde-*.AppImage
            release/VeloIde-*.deb
            release/VeloIde-Portable-*.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build macOS Installer (.dmg) & Portable (.zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dmg --arm64 --publish never
          node scripts/build-portable.mjs mac arm64

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            release/VeloIde-*.dmg
            release/VeloIde-Portable-*.zip

  publish-unix-assets:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: assets

      - name: Attach Linux & macOS Installer + Portable assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-windows.outputs.tag }}
        run: |
          ls -lh assets/
          gh release upload "$TAG" assets/* --clobber
